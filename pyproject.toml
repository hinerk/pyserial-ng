[build-system]
requires = ["setuptools>=61.0", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "pyserial-ng"
dynamic = ["version"]
description = "convenience wrapper around pyserial"
authors = [{ name = "Hinerk Stender", email = "hinerk.stender@mail.de" }]
requires-python = ">=3.13"
dependencies = [
    'pyserial'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools-git-versioning]
enabled = true
